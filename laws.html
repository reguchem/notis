<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>기후에너지환경부 법령 동향</title>
<meta name="description" content="기후에너지환경부·화학물질안전원·국립환경과학원의 최근 입법예고, 행정예고, 법령 공포·시행, 고시·훈령·예규를 모아 보여 줍니다.">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f8fb,#111820);--surface:light-dark(#fff,#19232d);--surface2:light-dark(#f0f4f8,#202c38);--text:light-dark(#17212b,#edf3f8);--muted:light-dark(#617181,#aebdca);--line:light-dark(#dce4eb,#33424f);--brand:light-dark(#1f497d,#8fb8e8);--link:light-dark(#2a5d9f,#9cc3f0);--tag:light-dark(#eaf2fb,#213d5b);--warn:light-dark(#8a5a00,#f1c46b);--warn-bg:light-dark(#fff6e5,#3a2e14)}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Malgun Gothic","Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--link)}
.header{background:linear-gradient(135deg,#173a63,#285c91);color:#fff;padding:34px 24px 30px}
.header-inner,.container{max-width:1180px;margin:0 auto}
.eyebrow{font-size:13px;opacity:.85;margin-bottom:9px}.eyebrow a{color:inherit}
.header h1{margin:0;font-size:28px;letter-spacing:-.8px}
.header p{margin:10px 0 0;opacity:.88;font-size:14px;line-height:1.6}
.container{padding:24px}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.jump a{font-size:13px;font-weight:700;text-decoration:none;padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--brand)}
.jump a span{color:var(--muted);font-weight:400;margin-left:4px}
section{margin-top:30px}
h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:0 0 12px;padding-bottom:10px;border-bottom:2px solid var(--brand);font-size:19px;color:var(--brand)}
h2 small{font-size:13px;font-weight:400;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);font-size:14px}
.tbl th{background:var(--surface2);font-weight:700;padding:12px 10px;border:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;border:1px solid var(--line);text-align:center;vertical-align:middle;line-height:1.5}
.tbl td.t{text-align:left}.tbl td:not(.t){white-space:nowrap}
.tbl td.t a{text-decoration:none;font-weight:600}.tbl td.t a:hover{text-decoration:underline}
.tbl td.no{width:52px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--tag);color:var(--brand);margin:1px 2px;white-space:nowrap}
.tag.new{background:#d6453d;color:#fff}
.tag.soon{background:var(--warn-bg);color:var(--warn)}
.sub{display:block;font-size:12px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);font-size:14px}
.note{margin-top:30px;padding:15px 17px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:13px;line-height:1.7;color:var(--muted)}
.stale{margin-top:16px;padding:12px 15px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13px}
@media(max-width:760px){
 .header{padding:26px 16px}.header h1{font-size:23px}.container{padding:16px}
 .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
 .tbl thead{display:none}.tbl{border:0;background:none}
 .tbl tr{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:12px 14px}
 .tbl td{border:0;padding:3px 0;text-align:left;display:flex;gap:10px;white-space:normal!important}
 h2{font-size:17px}h2 small{flex-basis:100%}
 .tbl td::before{content:attr(data-th);flex:none;width:88px;color:var(--muted);font-size:12px;padding-top:2px}
 .tbl td.t,.tbl td.no{display:block}.tbl td.t::before,.tbl td.no::before{display:none}
 .tbl td.no{display:none}.tbl td.t{font-size:15px;margin-bottom:6px}
}

.site-footer{padding:8px 16px 32px;color:var(--muted);font-size:13px}
.site-footer a{color:var(--muted)}
.corp{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px auto 0;padding-top:18px;border-top:1px solid var(--line);max-width:720px;text-align:left}
.logo{display:block;height:38px;width:auto}
.logo-link{flex:none;border-radius:8px}
@media (prefers-color-scheme:dark){.logo-link{background:#fff;padding:5px 8px}}
.corp-info{display:flex;flex-direction:column;gap:1px;line-height:1.6}
.corp-info strong{color:var(--text);font-size:13px}
.corp-info address{font-style:normal;font-size:12px}
.corp-info small{font-size:11px;letter-spacing:.3px}
.nowrap{white-space:nowrap}
@media(max-width:560px){.corp{flex-direction:column;text-align:center;gap:10px}.corp-info{align-items:center}}
</style>
</head>
<body>
<header class="header"><div class="header-inner">
  <div class="eyebrow"><a href="index.html">← 물질 등록 조회</a> · 법령 동향</div>
  <h1>기후에너지환경부 법령 동향</h1>
  <p id="lead">기후에너지환경부와 화학물질안전원·국립환경과학원의 최근 입법예고, 행정예고, 법령 공포·시행, 고시·훈령·예규를 모아 보여 줍니다.</p>
</div></header>
<main class="container">
  <nav class="jump" id="jump"></nav>
  <div id="stale"></div>
  <div id="sections"></div>
  <div class="note" id="note"></div>
</main>
<footer class="site-footer">
  <div class="corp">
    <a href="https://www.to21.co.kr" target="_blank" rel="noopener" class="logo-link"><img src="images/to21-logo.png" alt="티오이십일" class="logo" width="178" height="61"></a>
    <div class="corp-info">
      <strong>티오이십일 화학규제본부 등록대응팀</strong>
      <address>06631 서울시 서초구 서초대로 350, 2층(서초동, 동아빌라트) <span class="nowrap">Tel. <a href="tel:+82260051228">82-2-6005-1228</a></span></address>
      <small>COPYRIGHT ⓒ TO21. ALL RIGHTS RESERVED.</small>
    </div>
  </div>
</footer>
<script src="data/laws.js"></script>
<script>
const D = window.LAW_DATA || {};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dot = d => d ? String(d).replace(/^(\d{4})-0?(\d+)-0?(\d+)$/, '$1. $2. $3.') : '-';
const link = (t, u) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>` : esc(t);
const isNew = x => x.firstSeen && x.firstSeen === D.updated;
const NEW = x => isNew(x) ? ' <span class="tag new">NEW</span>' : '';
const range = `최근 3일 · ${dot(D.from)} ~ ${dot(D.to)}`;
const SECTIONS = [
  {id:'leg', key:'legislative', title:'입법예고 현황', sub:range,
   cols:['No','법령 제명','소관부처','법령분야','입법의견 접수기간','남은기간'],
   row:(x,i)=>[i, link(x.title,x.url)+NEW(x)+(x.kind?` <span class="tag">${esc(x.kind)}</span>`:''), `${esc(x.org)}${x.lawType?`<span class="sub">(${esc(x.lawType)})</span>`:''}`, esc(x.field), esc(x.period), esc(x.remain)]},
  {id:'adm', key:'administrative', title:'행정예고 현황', sub:range,
   cols:['No','행정예고명','행정규칙','기관(공고번호)','입법의견 접수기간'],
   row:(x,i)=>[i, link(x.title,x.url)+NEW(x), esc(x.ruleType), `${esc(x.org)}${x.notice?`<span class="sub">(${esc(x.notice)})</span>`:''}`, esc(x.period)]},
  {id:'law', key:'laws', title:'법령 현황: 공포 · 시행 · 예정', sub:`${range} · 시행예정은 앞으로 ${D.ahead||7}일`,
   cols:['No','법령명','구분','소관부처','제정·개정구분','법령종류','공포일자','시행일자'],
   row:(x,i)=>[i, link(x.title,x.url)+NEW(x), (x.tags||[]).map(t=>`<span class="tag${t==='시행예정'?' soon':''}">${esc(t)}</span>`).join(''), esc(x.org), esc(x.revision), esc(x.lawType), dot(x.promulgated), dot(x.effective)]},
  {id:'rule', key:'rules', title:'법령 현황: 고시 · 훈령 · 예규', sub:range,
   cols:['No','행정규칙명','발령·등록일자','발령번호','소관부서명'],
   row:(x,i)=>[i, link(x.title,x.url)+NEW(x), dot(x.date), esc(x.number), esc(x.org)]}
];
document.getElementById('jump').innerHTML = SECTIONS.map(s=>`<a href="#${s.id}">${esc(s.title.replace('법령 현황: ',''))}<span>${(D[s.key]||[]).length}</span>${(D[s.key]||[]).some(isNew)?' <b class="tag new">NEW</b>':''}</a>`).join('');
document.getElementById('sections').innerHTML = SECTIONS.map(s=>{
  const items = D[s.key] || [];
  const body = items.length
    ? `<table class="tbl"><thead><tr>${s.cols.map(c=>`<th scope="col">${c}</th>`).join('')}</tr></thead><tbody>${items.map((x,i)=>`<tr>${s.row(x,i+1).map((v,j)=>`<td data-th="${s.cols[j]}" class="${j===0?'no':j===1?'t':''}">${v||'-'}</td>`).join('')}</tr>`).join('')}</tbody></table>`
    : `<div class="empty">최근 3일 동안 새로 등록된 내용이 없습니다.</div>`;
  return `<section id="${s.id}"><h2>⊙ ${esc(s.title)} <small>${esc(s.sub)}</small></h2>${body}</section>`;
}).join('');
if ((D.stale||[]).length) document.getElementById('stale').innerHTML = `<div class="stale">일부 자료(${D.stale.map(k=>SECTIONS.find(s=>s.key===k)?.title||k).join(', ')})를 이번에 새로 가져오지 못해 이전 자료를 보여 주고 있습니다.</div>`;
document.getElementById('note').innerHTML = `※ 매일 아침 자동으로 갱신됩니다. 마지막 갱신: ${dot(D.updated)}<br>대상 기관: ${esc((D.orgs||[]).join(', '))}. 입법예고와 법령은 기후에너지환경부 소관만 해당됩니다.<br>출처: <a href="https://opinion.lawmaking.go.kr" target="_blank" rel="noopener">국민참여입법센터</a>(입법예고·행정예고), <a href="https://www.law.go.kr" target="_blank" rel="noopener">국가법령정보센터</a>(법령), <a href="https://www.mcee.go.kr/home/web/index.do?menuId=71" target="_blank" rel="noopener">기후에너지환경부</a>(고시·훈령·예규). 정확한 내용은 각 원문에서 확인해 주세요.`;
</script>
</body>
</html>
