name: 공지사항 자동 갱신

on:
  schedule:
    - cron: '0 22 * * *'   # 매일 한국시간 오전 7시 (UTC 22시)
  workflow_dispatch:        # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 공지사항 가져오기
        run: python tools/update_notices.py
      - name: 바뀐 내용이 있으면 커밋
        run: |
          if git diff --quiet -- data/notices.js; then
            echo "변경 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data/notices.js
            git commit -m "공지사항 자동 갱신 $(date -u -d '+9 hours' +%Y-%m-%d)"
            git push
          fi
