<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>화평법 물질 등록 조회</title>
<meta name="description" content="CAS 번호나 KE 번호로 화평법 등록 구분과 문의처를 확인합니다.">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f7f9fc,#10161d);--surface:light-dark(#fff,#18212b);--surface2:light-dark(#f1f5f9,#1f2a36);--text:light-dark(#17212b,#edf3f8);--muted:light-dark(#5f6f7e,#a9b8c6);--line:light-dark(#d9e2ea,#33424f);--brand:light-dark(#1f497d,#8fb8e8);--brand-strong:#1f497d;--ok-bg:light-dark(#e8f5ee,#16322a);--ok:light-dark(#17693f,#7fd3a6);--warn-bg:light-dark(#fff6e5,#3a2e14);--warn:light-dark(#8a5a00,#f1c46b);--focus:light-dark(#2f6db3,#8fb8e8);--accent-bg:light-dark(#e8f0fa,#1c2f45)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Pretendard","Malgun Gothic","Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh}
a{color:var(--brand)}
main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column}
.hero{padding-top:22vh;transition:padding-top .25s ease;text-align:center}
body.has-result .hero{padding-top:48px}
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.2px;margin-bottom:12px}
h1{margin:0 0 28px;font-size:clamp(26px,5vw,36px);letter-spacing:-1px;font-weight:700}
body.has-result h1{font-size:24px;margin-bottom:20px}
form{display:flex;gap:8px;align-items:stretch}
.box{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 20px;box-shadow:0 2px 10px rgba(20,45,70,.06);transition:box-shadow .15s,border-color .15s}
.box:focus-within{border-color:var(--focus);box-shadow:0 4px 18px rgba(31,73,125,.16)}
.box svg{flex:none;color:var(--muted)}
input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:17px;padding:15px 0}
button.go{border:0;border-radius:999px;background:var(--brand-strong);color:#fff;font:inherit;font-size:15px;font-weight:700;padding:0 24px;cursor:pointer}
button.go:hover{filter:brightness(1.12)}
input:focus-visible{outline:0}button.go:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hint{margin-top:14px;font-size:13px;color:var(--muted)}
.hint button{border:0;background:none;color:var(--brand);font:inherit;cursor:pointer;padding:0 2px;text-decoration:underline;text-underline-offset:2px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px auto 0;max-width:688px}
.qbtn{position:relative;display:flex;align-items:center;gap:12px;text-align:left;text-decoration:none;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;transition:border-color .15s,box-shadow .15s,transform .15s}
.qbtn:hover{border-color:var(--focus);box-shadow:0 6px 18px rgba(31,73,125,.12);transform:translateY(-1px)}
.qbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.qicon{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--accent-bg);color:var(--brand)}
.qtext{display:flex;flex-direction:column;min-width:0}
.qtext b{font-size:14px;line-height:1.4}
.qtext small{font-size:12px;color:var(--muted);margin-top:2px}
.qnew{margin-left:auto;flex:none;font-size:11px;font-weight:800;letter-spacing:.3px;color:#fff;background:#d6453d;border-radius:999px;padding:3px 8px}
body.has-result .quick{margin-top:18px}
@media(max-width:560px){.quick{grid-template-columns:1fr}}
#result{margin:28px 0 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px}
.status{display:flex;align-items:center;gap:10px;padding:16px 22px;font-weight:700;font-size:16px}
.status.late{background:var(--ok-bg);color:var(--ok)}
.status.new{background:var(--warn-bg);color:var(--warn)}.status.joint{background:var(--accent-bg);color:var(--brand)}
.status .dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.body{padding:20px 22px 22px}
.name{font-size:18px;font-weight:700;line-height:1.4;word-break:break-word;margin:0 0 12px}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0;font-size:14px}
dt{color:var(--muted)}dd{margin:0;word-break:break-all}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--brand);margin-right:6px}
.next{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--surface2);font-size:14px;line-height:1.7}
.next strong{display:block;font-size:15px;margin-bottom:4px}
.contact{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:10px}
.tel{display:inline-flex;align-items:center;gap:8px;font-size:18px;font-weight:700;text-decoration:none;background:var(--surface);border:1px solid var(--line);padding:9px 16px;border-radius:12px}
.org{font-size:14px;color:var(--muted)}
.list-head{font-size:14px;color:var(--muted);margin:0 0 10px}
.pick{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px;cursor:pointer;color:var(--text);font:inherit}
.pick:hover{border-color:var(--focus)}
.pick small{display:block;color:var(--muted);margin-top:3px}
.msg{font-size:14px;line-height:1.7;color:var(--muted)}
.recheck{margin-top:14px;padding:16px 18px;border-radius:14px;border:1px solid var(--line);font-size:14px;line-height:1.7}.recheck strong{display:block;font-size:15px;color:var(--warn)}.recheck p{margin:6px 0}.recheck blockquote{margin:10px 0;padding:12px 14px;border-left:3px solid var(--brand);background:var(--surface2);border-radius:0 10px 10px 0}.recheck ol{margin:8px 0 0;padding-left:22px}.recheck li{margin:4px 0}
footer{padding:22px 16px 28px;text-align:center;font-size:13px;color:var(--muted);line-height:1.8}
footer nav{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:6px}
footer a{color:var(--muted)}footer a:hover{color:var(--brand)}
.corp{display:flex;align-items:center;justify-content:center;gap:18px;margin:18px auto 0;padding-top:18px;border-top:1px solid var(--line);max-width:720px;text-align:left}
.logo{display:block;height:38px;width:auto}
.logo-link{flex:none;border-radius:8px}
@media (prefers-color-scheme:dark){.logo-link{background:#fff;padding:5px 8px}}
.corp-info{display:flex;flex-direction:column;gap:1px;line-height:1.6}
.corp-info strong{color:var(--text);font-size:13px}
.corp-info address{font-style:normal;font-size:12px}
.corp-info small{font-size:11px;letter-spacing:.3px}
.nowrap{white-space:nowrap}
@media(max-width:560px){.corp{flex-direction:column;text-align:center;gap:10px}.corp-info{align-items:center}}
@media(max-width:560px){.hero{padding-top:14vh}form{flex-direction:column}button.go{padding:14px}input{font-size:16px}dl{grid-template-columns:1fr;gap:2px}dd{margin-bottom:8px}}
</style>
</head>
<body>
<main>
  <section class="hero">
    <div class="eyebrow">화학물질의 등록 및 평가 등에 관한 법률(화평법)</div>
    <h1>우리 물질, 어떻게 등록해야 할까요?</h1>
    <form id="f" role="search" autocomplete="off">
      <label class="box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="CAS 번호 또는 KE 번호 (예: 13463-41-7, KE-35577)" aria-label="CAS 번호 또는 KE 번호" autofocus>
      </label>
      <button class="go" type="submit">검색</button>
    </form>
    <div class="hint" id="hint">예시: <button type="button" data-q="13463-41-7">13463-41-7</button> · <button type="button" data-q="74-93-1">74-93-1</button> · 영문 물질명 일부로도 찾을 수 있습니다.</div>
    <nav class="quick" aria-label="바로가기">
      <a class="qbtn" href="notices.html"><span class="qicon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></span><span class="qtext"><b>산업계도움센터 최근 공지사항</b><small id="qNoticeSub">최근 1개월 공지</small></span><span class="qnew" id="qNoticeNew" hidden></span></a>
      <a class="qbtn" href="laws.html"><span class="qicon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M5 21h14"/><path d="M3 7h18"/><path d="m6 7-3 7a3 3 0 0 0 6 0z"/><path d="m18 7-3 7a3 3 0 0 0 6 0z"/></svg></span><span class="qtext"><b>기후에너지환경부 법령 동향</b><small id="qLawSub">최근 3일 법령 동향</small></span><span class="qnew" id="qLawNew" hidden></span></a>
    </nav>
  </section>
  <section id="result" aria-live="polite"></section>
</main>
<footer>
  <nav><a href="https://www.to21.co.kr" target="_blank" rel="noopener">티오이십일 바로가기</a></nav>
  <div id="asof"></div>
  <div class="corp">
    <a href="https://www.to21.co.kr" target="_blank" rel="noopener" class="logo-link"><img src="images/to21-logo.png" alt="티오이십일" class="logo" width="178" height="61"></a>
    <div class="corp-info">
      <strong>티오이십일 화학규제본부 등록대응팀</strong>
      <address>06631 서울시 서초구 서초대로 350, 2층(서초동, 동아빌라트) <span class="nowrap">Tel. <a href="tel:+82260051228">82-2-6005-1228</a></span></address>
      <small>COPYRIGHT ⓒ TO21. ALL RIGHTS RESERVED.</small>
    </div>
  </div>
</footer>
<script src="data/notices.js"></script>
<script src="data/laws.js"></script>
<script src="data/substances.js"></script>
<script src="data/existing.js"></script>
<script>
const DATA = window.SUBSTANCE_DATA || {items:[],asof:''};
const EXIST = window.EXISTING_DATA || {lists:[]};
const CONTACT = {tel:'02-6005-1228', href:'tel:0260051228'};
const STATUS = {
  late: {label:'기존화학물질 · 공동등록 완료 · 후발등록 대상', cls:'late',
    next:()=>'이미 공동등록이 완료된 물질입니다. 이 물질을 제조·수입하려면 기존 공동등록에 참여하는 <b>후발등록</b>을 진행해야 합니다. 아래 문의처로 연락해 참여 절차와 자료 사용 조건을 확인하세요.'},
  joint:{label:'기존화학물질 · 공동등록 진행 대상', cls:'joint',
    next:it=>`기존화학물질 목록(${esc(it.list)})에 있고, 공동등록 완료 목록(기준일 ${esc(DATA.asof)})에는 없는 물질입니다. 등록하려면 같은 물질을 제조·수입하는 다른 사업자와 함께 <b>공동등록</b>을 진행해야 합니다. 아래 번호로 문의해 주세요.`},
  new:  {label:'신규화학물질', cls:'new',
    next:()=>'기존화학물질 목록(별표1·별표2)과 공동등록 완료 목록에 모두 없는 물질이므로 <b>신규화학물질</b>입니다. 등록서류를 <b>개별로</b> 준비해 제출해야 합니다. 번호가 정확한지 한 번 더 확인하신 뒤 아래 번호로 문의해 주세요.'}
};
const $ = id => document.getElementById(id);
const key = s => String(s||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
const casKey = s => key(s).replace(/^0+/,'');
const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function casValid(s){if(!/^\d{2,7}-\d{2}-\d$/.test(s))return false;const d=s.replace(/-/g,''),b=d.slice(0,-1);let sum=0;for(let i=0;i<b.length;i++)sum+=Number(b[b.length-1-i])*(i+1);return sum%10===Number(d.slice(-1))}

// 검색용 색인 만들기
const joint = DATA.items.map(it=>({...it, status:'late'}));
const existing = [];
EXIST.lists.forEach(l=>l.rows.forEach(([id,n,cas])=>existing.push({id:[id], n, cas, casRaw:cas.join(', '), list:l.label, status:'joint'})));
const idx = new Map(); const add=(k,it)=>{if(!k)return; if(!idx.has(k))idx.set(k,[]); idx.get(k).push(it)};
const listOf = new Map();
existing.forEach(it=>{it.id.forEach(id=>{add('I'+key(id),it); listOf.set(key(id),it.list)}); it.cas.forEach(c=>add('C'+casKey(c),it))});
joint.forEach(it=>{it.id.forEach(id=>add('I'+key(id),it)); (it.cas.length?it.cas:[it.casRaw]).forEach(c=>add('C'+casKey(c),it)); it.list=it.id.map(id=>listOf.get(key(id))).filter(Boolean)[0]||''});

const total = existing.length;
$('asof').textContent = `자료: 공동등록 완료 물질 ${joint.length.toLocaleString()}건(기준일 ${DATA.asof}) · 기존화학물질 별표1·별표2 ${total.toLocaleString()}건`;

function uniq(arr){return [...new Set(arr)]}

// 바로가기 버튼: 어제와 비교해 오늘 새로 들어온 건이 있으면 NEW 표시
(function(){
  const isNew = (x, d) => x && x.firstSeen && x.firstSeen === d.updated;
  const setNew = (id, n) => { const el = $(id); if (n > 0) { el.textContent = `NEW ${n}`; el.hidden = false; el.parentElement.setAttribute('aria-label', el.parentElement.textContent.replace(/NEW \d+$/, '') + ` (오늘 새 글 ${n}건)`); } };
  const N = window.NOTICE_DATA, L = window.LAW_DATA;
  if (N) { setNew('qNoticeNew', (N.items||[]).filter(x => isNew(x, N)).length); $('qNoticeSub').textContent = `최근 1개월 ${(N.items||[]).length}건`; }
  if (L) { const ks = ['legislative','administrative','laws','rules']; const total = ks.reduce((a,k)=>a+(L[k]||[]).length,0); setNew('qLawNew', ks.reduce((a,k)=>a+(L[k]||[]).filter(x => isNew(x, L)).length,0)); $('qLawSub').textContent = `최근 3일 ${total}건`; }
})();
function search(raw){
  const q = raw.trim(); if(!q) return {type:'empty'};
  let hits = uniq([...(idx.get('I'+key(q))||[]), ...(idx.get('C'+casKey(q))||[])]);
  if(hits.length){
    const late = hits.filter(h=>h.status==='late');
    return {type:'hit', items: late.length ? late : hits};
  }
  if(/[A-Z가-힣]{3,}/i.test(q) && !/^KE[-\s]?\d/i.test(q)){
    const lq = q.toLowerCase(), seen = new Set(), out = [];
    for(const it of [...joint, ...existing]){ if(out.length>=30) break; if(it.n.toLowerCase().includes(lq)){const k=it.id.join(); if(seen.has(k))continue; seen.add(k); out.push(it)} }
    if(out.length) return {type:'names', items: out, q};
  }
  return {type:'new', q};
}

function telBlock(it){
  if(it.status!=='late') return `<div class="contact"><a class="tel" href="${CONTACT.href}">☎ ${CONTACT.tel}</a></div>`;
  const d = (it.tel.match(/[\d-]{7,}/)||[''])[0];
  if(!it.tel && !it.org) return `<div class="contact"><a class="tel" href="${CONTACT.href}">☎ ${CONTACT.tel}</a><span class="org">등록된 대리인 문의처가 없어 대표번호를 안내합니다.</span></div>`;
  return `<div class="contact">${it.tel?(d?`<a class="tel" href="tel:${esc(d.replace(/-/g,''))}">☎ ${esc(it.tel)}</a>`:`<span class="tel">${esc(it.tel)}</span>`):''}${it.org?`<span class="org">담당 대리인 · ${esc(it.org)}</span>`:''}</div>`;
}
function card(it){
  const st = STATUS[it.status];
  const tags = [it.list, it.note].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  return `<article class="card"><div class="status ${st.cls}"><span class="dot"></span>${st.label}</div><div class="body">
    <p class="name">${esc(it.n||'-')}</p>
    <dl><dt>CAS 번호</dt><dd>${esc(it.casRaw||'-')}</dd><dt>고유번호</dt><dd>${esc(it.id.join(', ')||'-')}</dd>${tags?`<dt>구분</dt><dd>${tags}</dd>`:''}</dl>
    <div class="next"><strong>다음 단계</strong>${st.next(it)}${telBlock(it)}</div>
  </div></article>`;
}
function render(res){
  const el = $('result');
  document.body.classList.toggle('has-result', res.type!=='empty');
  if(res.type==='empty'){el.innerHTML='';return}
  if(res.type==='hit'){el.innerHTML = res.items.map(card).join('');return}
  if(res.type==='names'){
    el.innerHTML = `<p class="list-head">'${esc(res.q)}'이(가) 들어간 물질 ${res.items.length}건${res.items.length===30?' (앞 30건만 표시)':''}</p>` +
      res.items.map((it,i)=>`<button class="pick" data-i="${i}">${esc(it.n)}<small>${STATUS[it.status].label} · CAS ${esc(it.casRaw||'-')} · ${esc(it.id.join(', '))}</small></button>`).join('');
    el.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{el.innerHTML=card(res.items[b.dataset.i]);window.scrollTo({top:0,behavior:'smooth'})});
    return;
  }
  const q = res.q.trim();
  const warn = `<p class="msg">입력한 ${/^\d{2,7}-?\d{2}-?\d$/.test(q) ? 'CAS 번호' : '번호'}는 기존화학물질 목록에 등재되어 있지 않습니다.</p>`;
  el.innerHTML = `<article class="card"><div class="status new"><span class="dot"></span>${STATUS.new.label}</div><div class="body">
    <p class="name">${esc(q)}</p>${warn}
    <div class="next"><strong>다음 단계</strong>${STATUS.new.next()}${telBlock({status:'new'})}</div>
    <div class="recheck"><strong>기존화학물질로 인정될 수 있는지 다시 확인해 보세요</strong>
      <p>기존화학물질 목록에 없더라도, 아래 경우에 해당하면 기존화학물질로 봅니다.</p>
      <blockquote><b>기존화학물질 고시 제3조(기존화학물질 인정)</b> 다음 각 호에 해당하는 경우는 기존화학물질로 본다.
        <ol><li>기존화학물질의 수화물 또는 무수물</li>
        <li>2가지 이상의 성분으로 구성된 반응생성물로서 모든 성분이 기존화학물질인 경우(반응생성물 내 각 성분의 분리가 기술적으로 어렵고 그 자체로 시장에 유통되거나 취급되는 경우로 한정한다.)</li>
        <li>기존화학물질로 고시된 다성분물질의 하위이성질체</li>
        <li>그 밖에 <a href="https://www.law.go.kr/admRulSc.do?menuId=5&amp;subMenuId=41&amp;tabMenuId=183&amp;query=%EA%B8%B0%EC%A1%B4%ED%99%94%ED%95%99%EB%AC%BC%EC%A7%88#AJAX" target="_blank" rel="noopener">[별표 3]</a>에 해당하는 화학물질</li></ol>
      </blockquote>
      <p>해당 여부가 애매하면 위 번호로 문의해 주세요.</p>
    </div>
  </div></article>`;
}
function run(q, push=true){
  $('q').value = q; render(search(q));
  if(push){const u=new URL(location.href); q?u.searchParams.set('q',q):u.searchParams.delete('q'); history.replaceState(null,'',u)}
}
$('f').addEventListener('submit', e=>{e.preventDefault(); run($('q').value)});
$('hint').querySelectorAll('button[data-q]').forEach(b=>b.onclick=()=>run(b.dataset.q));
const initial = new URLSearchParams(location.search).get('q'); if(initial) run(initial,false);
</script>
