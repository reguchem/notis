<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>산업계도움센터 최근 공지사항</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f8fb,#111820);--surface:light-dark(#fff,#19232d);--surface2:light-dark(#f8fafc,#202c38);--text:light-dark(#17212b,#edf3f8);--muted:light-dark(#667584,#aebdca);--line:light-dark(#dce4eb,#33424f);--brand:#1f497d;--accent:light-dark(#eaf2fb,#213d5b)}
*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--text)}
#app{min-height:100vh;background-color:var(--bg)}
.header{background:linear-gradient(135deg,#173a63,#285c91);color:#fff;padding:34px 24px 30px}.header-inner{max-width:1080px;margin:auto}.eyebrow{font-size:13px;opacity:.78;margin-bottom:9px}.header h1{margin:0;font-size:28px;letter-spacing:-.8px}.header p{margin:10px 0 0;opacity:.88;font-size:14px}
.container{max-width:1080px;margin:0 auto;padding:24px}.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.count{font-size:14px;color:var(--muted)}.badge{display:inline-flex;align-items:center;padding:7px 11px;border-radius:999px;background:var(--accent);color:var(--brand);font-size:12px;font-weight:700}
.list{display:grid;gap:10px}.item{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:18px 20px;cursor:pointer;transition:.16s transform,.16s box-shadow,.16s border-color}.item:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(25,55,80,.09);border-color:#9db6ce}.item-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.title{font-size:16px;font-weight:700;line-height:1.55;letter-spacing:-.25px}.date{white-space:nowrap;color:var(--muted);font-size:13px}.meta{display:flex;gap:9px;margin-top:9px;color:var(--muted);font-size:12px}.new{color:#c43d3d;font-weight:700}
.note{margin-top:20px;padding:15px 17px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:13px;line-height:1.65;color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:rgba(8,18,28,.58);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-backdrop.open{display:flex}.modal{width:min(760px,100%);max-height:88vh;overflow:auto;background:var(--surface);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.28)}.modal-head{padding:23px 24px 18px;border-bottom:1px solid var(--line)}.modal-title{font-size:20px;font-weight:800;line-height:1.5;margin:0}.modal-meta{margin-top:10px;color:var(--muted);font-size:13px}.modal-body{padding:24px;line-height:1.8;font-size:14px}.modal-body .summary{padding:15px 16px;border-radius:11px;background:var(--surface2);border:1px solid var(--line);margin-bottom:20px}.actions{display:flex;gap:9px;margin-top:22px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:11px 15px;text-decoration:none;font-weight:700;font-size:13px;cursor:pointer}.primary{background:#1f497d;color:#fff}.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--line)}.close{margin-left:auto;background:transparent;border:0;color:var(--muted);font-size:22px;cursor:pointer}.modal-head-row{display:flex;gap:12px;align-items:flex-start}
@media(max-width:640px){.header{padding:26px 18px}.header h1{font-size:23px}.container{padding:18px}.item{padding:16px}.item-top{display:block}.date{display:block;margin-top:7px}.bar{align-items:flex-start;flex-direction:column}.modal-body,.modal-head{padding:19px}}
</style>
</head>
<body>
<div id="app">
<header class="header"><div class="header-inner"><div class="eyebrow">산업계도움센터 · 안내 및 상담 · 공지사항</div><h1>최근 1개월 공지사항</h1><p>산업계도움센터 공지사항에서 최근 등록된 내용을 한눈에 확인할 수 있습니다.</p></div></header>
<main class="container">
<div class="bar"><div><span class="badge">최근 1개월</span> <span class="count">2026.08.31 ~ 2026.09.29 기준</span></div><div class="count">총 9건</div></div>
<section class="list" id="list"></section>
<div class="note">※ 목록과 등록일은 산업계도움센터 공지사항 페이지를 기준으로 2026년 9월 29일 확인한 내용입니다. 항목을 클릭하면 상세 내용을 볼 수 있으며, 원문은 산업계도움센터에서 열 수 있습니다.</div>
</main>
<div class="modal-backdrop" id="backdrop"><article class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div class="modal-head-row"><div style="flex:1"><h2 class="modal-title" id="mTitle"></h2><div class="modal-meta" id="mMeta"></div></div><button class="close" id="close" aria-label="닫기">×</button></div></div><div class="modal-body" id="mBody"></div></article></div>
</div>
<script>
const notices=[
{title:'2026년 화학물질 유해성시험자료 신규 및 기존화학물질 수요조사 안내',date:'2026-09-21',views:305,summary:'2026년 화학물질 유해성시험자료와 관련한 신규 및 기존화학물질 수요조사 안내 공지입니다. 세부 조사내용과 제출 방법은 원문 및 첨부자료에서 확인할 수 있습니다.'},
{title:'등록정보공개 및 자료보호 특례요청 안내',date:'2026-09-21',views:344,summary:'화학물질 등록정보 공개와 자료보호 특례요청에 관한 안내입니다. 적용 대상과 요청 절차 등 세부 사항은 원문에서 확인할 수 있습니다.'},
{title:'[2026년 화학물질 제도 이행 및 산업계 지원 권역별 설명회] 개최 안내',date:'2026-09-18',views:662,summary:'2026년 화학물질 제도 이행 및 산업계 지원을 위한 권역별 설명회 개최 안내입니다. 일정과 장소, 참여 방법 등은 원문을 확인해 주세요.'},
{title:'[2026년 산업계 대상 화평법 이행 교육 안내(10월)]',date:'2026-09-18',views:510,summary:'2026년 10월 산업계 대상 화평법 이행 교육 안내입니다. 교육 일정과 신청 관련 세부사항은 원문 및 첨부자료에서 확인할 수 있습니다.'},
{title:'「동물대체시험 인프라 구축 관련 설문조사」 참여 안내',date:'2026-09-10',views:280,summary:'동물대체시험 인프라 구축과 관련한 설문조사 참여 안내입니다. 설문 목적과 참여 방법은 원문에서 확인할 수 있습니다.'},
{title:'(신청마감) 화학물질 등록 이행 촉진을 위한 화학물질 업종별 간담회 개최 안내',date:'2026-09-09',views:764,summary:'화학물질 등록 이행 촉진을 위한 업종별 간담회 개최 안내입니다. 제목에 표시된 것처럼 신청이 마감된 공지입니다.'},
{title:'산업계도움센터 서버 작업으로 인한 시스템 중단 안내(9.9.(수))',date:'2026-09-07',views:143,summary:'산업계도움센터 서버 작업에 따른 시스템 중단 안내입니다.'},
{title:'「GLP 기반 동물대체법 시범 교육훈련」 개최 안내',date:'2026-09-02',views:288,summary:'GLP 기반 동물대체법 시범 교육훈련 개최 안내입니다. 교육 일정과 참가 관련 내용은 원문에서 확인할 수 있습니다.'},
{title:'「산업계 녹색화학 실천 우수사례」 공모전 개최 안내',date:'2026-08-31',views:207,summary:'산업계 녹색화학 실천 우수사례 공모전 개최 안내입니다. 공모 내용과 신청 방법 등은 원문에서 확인할 수 있습니다.'}
];
const original='https://www.chemnavi.or.kr/chemnavi/spboard/notice.do';
const list=document.getElementById('list');
notices.forEach((n,i)=>{const b=document.createElement('button');b.className='item';b.innerHTML=`<div class="item-top"><div class="title">${n.title}</div><div class="date">${n.date}</div></div><div class="meta"><span>관리자</span><span>·</span><span>조회 ${n.views}</span>${i<4?'<span class="new">· NEW</span>':''}</div>`;b.onclick=()=>openModal(n);list.appendChild(b)});
function openModal(n){document.getElementById('mTitle').textContent=n.title;document.getElementById('mMeta').textContent=`작성자 관리자 · 등록일 ${n.date} · 조회 ${n.views}`;document.getElementById('mBody').innerHTML=`<div class="summary">${n.summary}</div><div>이 페이지는 산업계도움센터의 최근 공지사항을 별도로 모아 보여주는 화면입니다. 최신 공지의 정확한 본문, 첨부파일 및 원문 형식은 아래 원문 보기에서 확인할 수 있습니다.</div><div class="actions"><a class="btn primary" href="${original}" target="_blank" rel="noopener">산업계도움센터 원문 보기 ↗</a><button class="btn secondary" onclick="closeModal()">닫기</button></div>`;document.getElementById('backdrop').classList.add('open')}
function closeModal(){document.getElementById('backdrop').classList.remove('open')}
document.getElementById('close').onclick=closeModal;document.getElementById('backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script>
</body></html>
